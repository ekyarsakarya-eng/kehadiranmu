<!DOCTYPE html>
<html lang="id">
<head>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#800000">
  <link rel="apple-touch-icon" href="logo.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Absensi Satpam Terpadu</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            'header': ['Montserrat', 'sans-serif'],
            'sans': ['Inter', 'sans-serif']
          }
        }
      }
    }
  </script>
  <style>
    * { -webkit-tap-highlight-color: transparent; }
    body { font-family: 'Inter', sans-serif; }

    :root {
    --accent-primary: #800000;
    --accent-secondary: #a00000;
    --accent-gradient: linear-gradient(135deg, #800000, #600000);
    --accent-glow: rgba(128, 0, 0, 0.4);
  }

  /* Paksa semua biru/ungu jadi maroon */
 .bg-blue-500,.bg-blue-600,.bg-purple-500,.bg-purple-600,
  [style*="linear-gradient"][style*="rgb(59, 130, 246)"],
  [style*="linear-gradient"][style*="rgb(168, 85, 247)"] {
    background: var(--accent-gradient)!important;
  }

  /* Kuning jadi krem */
 .bg-yellow-500,.bg-yellow-600 {
    background-color: #f5e6d3!important;
    color: #800000!important;
  }

  /* Badge "Belum" */
 .bg-yellow-500.text-xs {
    background-color: #e8d5c4!important;
    color: #600000!important;
  }

  /* Tombol nav aktif */
 .text-\[\#800000\] { color: #800000!important; }
    [data-time="pagi"] {
      --accent-primary: #f59e0b;
      --accent-gradient: linear-gradient(135deg, #f59e0b, #d97706);
      --accent-glow: rgba(245,158,11,0.4);
    }
    [data-time="siang"] {
      --accent-primary: #3b82f6;
      --accent-gradient: linear-gradient(135deg, #3b82f6, #2563eb);
      --accent-glow: rgba(59,130,246,0.4);
    }
    [data-time="sore"] {
      --accent-primary: #8b5cf6;
      --accent-gradient: linear-gradient(135deg, #8b5cf6, #7c3aed);
      --accent-glow: rgba(139,92,246,0.4);
    }
    [data-time="malam"] {
      --accent-primary: #6366f1;
      --accent-gradient: linear-gradient(135deg, #6366f1, #4f46e5);
      --accent-glow: rgba(99,102,241,0.4);
    }

    @keyframes slideUpBounce {
      0% { transform: translateY(30px); opacity: 0; }
      60% { transform: translateY(-5px); }
      100% { transform: translateY(0); opacity: 1; }
    }
    @keyframes glow {
      0%, 100% { box-shadow: 0 20px var(--accent-glow); }
      50% { box-shadow: 0 0 30px var(--accent-glow), 0 0 40px var(--accent-glow); }
    }
    @keyframes shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }
    .animate-slide-up-bounce { animation: slideUpBounce 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
    .animate-glow { animation: glow 2s ease-in-out infinite; }
    .shimmer {
      background: linear-gradient(90deg, transparent, rgba(255,255,0.3), transparent);
      background-size: 200% 100%;
      animation: shimmer 2s infinite;
    }
    .glass {
      background: rgba(255,255,0.1);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,0.2);
    }
    .dark.glass {
      background: rgba(0,0,0,0.2);
      border: 1px solid rgba(255,255,0.1);
    }
    
  </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 transition-colors">
  <div id="app"></div>
  <script src="app.js"></script>
</body>
</html>
