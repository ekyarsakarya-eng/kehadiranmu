<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#800000">
  <title>ABSENSI KEHADIRAN TERPADU</title>
  
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/png" href="./logo.png">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet">
  
  <style>
  /* === TEMA MAROON AMAN - GA GANGGU FUNGSI === */
  :root {
    --maroon: #800000;
    --maroon-dark: #600000;
    --cream: #f5e6d3;
    --cream-dark: #e8d5c4;
    --gold: #d4a574;
  }

  /* 1. BACKGROUND - Cuma ganti warna, ga ganggu layout */
  body { background: #fdf8f3; }
  .dark body { background: #0f1419 !important; }

  /* 2. CARD UTAMA - Cuma yang ada class khusus */
  .card-maroon { 
    background: linear-gradient(135deg, var(--maroon), var(--maroon-dark)) !important; 
  }
  
  /* 3. CARD KREM - Scope ketat */
  .bg-\[\#f5e6d3\] { background-color: var(--cream) !important; }
  .dark .bg-\[\#f5e6d3\] { 
    background-color: #3d2424 !important; 
  }

  /* 4. TEXT - Cuma warna, ga pake !important di semua */
  .text-\[\#800000\] { color: var(--maroon); }
  .dark .text-\[\#800000\] { color: var(--gold); }

  /* 5. TEXT DARKMODE - Cuma text-gray, bukan semua */
  .dark .text-gray-900 { color: #f5e6d3; }
  .dark .text-gray-800 { color: #e5e7eb; }
  .dark .text-gray-700 { color: #d1d5db; }
  .dark .text-gray-600 { color: #9ca3af; }

  /* 6. ANGKA & LABEL DI CARD KREM */
  .dark .bg-\[\#f5e6d3\] .text-2xl { color: var(--gold) !important; }
  .dark .bg-\[\#f5e6d3\] .text-xs { color: #d1d5db !important; }

  /* 7. HAPUS OVERRIDE BERBAHAYA */
  /* Jangan pake: [class*="purple"], [style*="--accent-gradient"], :not(.dark) */
  /* Itu yang bikin fungsi mati */
</style>
</head>
<body class="select-none">
  <div id="app"></div>
  <script src="./app.js"></script>
</body>
</html>
