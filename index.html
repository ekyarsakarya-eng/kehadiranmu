<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Absensi Kehadiran Terpadu</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
  .font-header { font-family: 'Montserrat', sans-serif; }
  .modal { backdrop-filter: blur(4px); }
    #video { transform: scaleX(-1); }
   .toggle-active { background: #3b82f6!important; color: white!important; }
  </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900">
  <div id="app"></div>
  
  <!-- Modal Loading -->
  <div id="modalLoading" class="hidden fixed inset-0 bg-black/50 z-[90] flex items-center justify-center modal">
    <div class="bg-white dark:bg-gray-800 p-6 rounded-2xl flex flex-col items-center">
      <div class="animate-spin rounded-full h-12 w-12 border-4 border-[#800000] border-t-transparent"></div>
      <p class="mt-4 font-semibold text-gray-700 dark:text-gray-200">Memproses...</p>
    </div>
  </div>
  
  <!-- Modal Kamera -->
  <div id="modalKamera" class="hidden fixed inset-0 bg-black z-[80] flex flex-col items-center justify-center">
    <video id="video" autoplay playsinline class="w-full h-full object-cover"></video>
    <div class="absolute bottom-8 flex gap-4">
      <button id="btnCloseKamera" class="bg-red-500 text-white px-6 py-3 rounded-full shadow-lg">
        <i class="ri-close-line text-2xl"></i>
      </button>
      <button id="btnCapture" class="bg-white text-black w-20 h-20 rounded-full border-4 border-gray-300 shadow-lg flex items-center justify-center">
        <i class="ri-camera-line text-3xl"></i>
      </button>
    </div>
    <p class="absolute top-4 text-white bg-black/50 px-4 py-2 rounded-lg text-sm">Arahkan wajah ke kamera</p>
  </div>
  
  <script src="app.js"></script>
</body>
</html>
